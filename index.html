<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProCamera 管理后台</title>
<style>
*{box-sizing:border-box}
body{background:#0d0d0d;color:#eee;font-family:-apple-system,system-ui;margin:0;padding:16px;padding-bottom:80px}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:12px;color:#888;margin-bottom:16px}
.card{background:#1a1a1a;border-radius:14px;padding:16px;margin-bottom:12px}
h3{margin:0 0 12px;font-size:15px}
.dev{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2a2a2a}
.dev:last-child{border:0}
.devinfo{flex:1}
.model{font-size:14px;font-weight:600}
.meta{font-size:11px;color:#888;margin-top:2px}
.toggle{width:46px;height:26px;background:#333;border-radius:13px;position:relative;cursor:pointer;flex-shrink:0}
.toggle.on{background:#fdd835}
.toggle::after{content:'';width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:0.2s}
.toggle.on::after{left:22px}
.feat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222}
.feat:last-child{border:0}
.feat span{font-size:14px}
#status{font-size:12px;color:#888;margin:12px 0}
#savebtn{position:fixed;bottom:20px;left:16px;right:16px;background:#fdd835;color:#000;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:bold}
.empty{color:#555;text-align:center;padding:20px;font-size:13px}
</style></head><body>
<h1>ProCamera 设备管理</h1>
<div class="sub">chenping316/procamera-admin</div>
<div id="status">加载中...</div>
<div class="card"><h3>在线设备 (<span id="dn">0</span>)</h3><div id="devs"></div></div>
<div class="card"><h3>功能开关</h3><div id="feats"></div></div>
<button id="savebtn" onclick="save()">保存更改</button>
<script>
let TOKEN=localStorage.getItem("gh_token")||"";
const REPO="chenping316/procamera-admin";
if(!TOKEN){TOKEN=prompt("输入GitHub令牌:");localStorage.setItem("gh_token",TOKEN);}
let sha="", data={devices:{},features:{}};
const FEATURES=[["pro_mode","专业模式"],["raw","RAW格式"],["long_exposure","长曝光"],["zoom_100x","100倍变焦"],["filters_28","28种滤镜"],["ai_edit","AI修图"],["beauty_retouch","美颜精修"],["external_lens","外接镜头"],["super_res","AI超分"],["hdr","HDR"],["night_mode","夜景模式"],["silent_shutter","静音快门"],["voice_shutter","声控快门"],["burst","连拍"],["timer","倒计时"],["watermark","水印"],["film_sim","胶片模拟"]];
async function load(){
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`,{headers:{"Authorization":`token ${TOKEN}`,"User-Agent":"procamera"}});
    const j=await r.json();
    sha=j.sha;
    data=JSON.parse(atob(j.content));
    render();
    document.getElementById("status").textContent="已加载 · "+Object.keys(data.devices).length+" 台设备在线";
  }catch(e){document.getElementById("status").textContent="加载失败: "+e}
}
function render(){
  const d=document.getElementById("devs");
  const ids=Object.keys(data.devices);
  document.getElementById("dn").textContent=ids.length;
  if(ids.length===0){d.innerHTML='<div class="empty">暂无设备上报</div>'}
  else d.innerHTML=ids.map(id=>{
    const info=data.devices[id];
    return `<div class="dev"><div class="devinfo"><div class="model">${info.model||"未知设备"}</div><div class="meta">设备码: ${id}</div><div class="meta">${new Date(info.lastSeen||0).toLocaleString()}</div></div><div class="toggle ${info.enabled!==false?'on':''}" onclick="toggleDev('${id}')"></div></div>`;
  }).join("");
  const f=document.getElementById("feats");
  f.innerHTML=FEATURES.map(([k,label])=>{
    const on=data.features[k]!==false;
    return `<div class="feat"><span>${label}</span><div class="toggle ${on?'on':''}" onclick="toggleFeat('${k}')"></div></div>`;
  }).join("");
}
function toggleDev(id){data.devices[id].enabled=data.devices[id].enabled===false;render();}
function toggleFeat(k){data.features[k]=data.features[k]===false;render();}
async function save(){
  document.getElementById("savebtn").textContent="保存中...";
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`,{method:"PUT",headers:{"Authorization":`token ${TOKEN}`,"Content-Type":"application/json","User-Agent":"procamera"},body:JSON.stringify({message:"update",content:b64,sha:sha})});
  document.getElementById("savebtn").textContent="已保存 ✓";
  setTimeout(()=>document.getElementById("savebtn").textContent="保存更改",1500);
}
load();
</script></body></html>
